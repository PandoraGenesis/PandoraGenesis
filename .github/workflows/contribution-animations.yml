name: Generate contribution animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Add solid background to SVGs
        run: |
          BG="#0b2b1a"
          for f in dist/github-snake-dark.svg dist/pacman-contribution-graph-dark.svg; do
            perl -0pi -e "s/(<svg[^>]*>)/\$1<style>text{fill:#c9d1d9 !important}<\/style><rect x=\"-2000\" y=\"-2000\" width=\"6000\" height=\"6000\" fill=\"$BG\"\/>/" "$f"
          done
          perl -0pi -e "s/(<rect\b[^>]*?)fill=\"[^\"]*\"/\$1fill=\"$BG\"/" dist/pacman-contribution-graph-dark.svg

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
