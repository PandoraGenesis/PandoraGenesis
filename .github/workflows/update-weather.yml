name: Update weather forecast

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate weather block
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.parse
          from datetime import datetime

          q = urllib.parse.urlencode({
              "key": os.environ["WEATHER_API_KEY"],
              "q": "Quy Nhon",
              "days": 5,
              "aqi": "no",
              "alerts": "no",
          })
          with urllib.request.urlopen("https://api.weatherapi.com/v1/forecast.json?" + q, timeout=30) as r:
              data = json.load(r)

          days = data["forecast"]["forecastday"]

          def row(label, cells):
              return "<tr><th>" + label + "</th>" + "".join(f"<td>{c}</td>" for c in cells) + "</tr>"

          dates = [datetime.strptime(d["date"], "%Y-%m-%d").strftime("%d/%m/%Y") for d in days]
          icons = [f'<img src="https:{d["day"]["condition"]["icon"]}" width="48" alt="">' for d in days]
          conds = [d["day"]["condition"]["text"] for d in days]
          temps = [f'{d["day"]["mintemp_c"]} - {d["day"]["maxtemp_c"]} °C' for d in days]
          winds = [f'{d["day"]["maxwind_kph"]} kph' for d in days]

          html = '<table align="center">\n' + "\n".join([
              row("Date", dates),
              row("Weather", icons),
              row("Condition", conds),
              row("Temperature", temps),
              row("Wind", winds),
          ]) + "\n</table>"
          open("weather.md", "w", encoding="utf-8").write(html)
          EOF

      - name: Insert block into README
        run: |
          python3 - <<'EOF'
          import re
          readme = open("README.md", encoding="utf-8").read()
          block = open("weather.md", encoding="utf-8").read().strip()

          block = re.sub(r"<th(?![a-z])", '<th align="center"', block)
          block = re.sub(r"<td(?![a-z])", '<td align="center"', block)

          pattern = r"(<!-- WEATHER:START -->).*?(<!-- WEATHER:END -->)"
          new = re.sub(pattern, lambda m: m.group(1) + "\n" + block + "\n" + m.group(2), readme, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(new)
          EOF

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "PandoraGenesis"
          git config user.email "<id>+PandoraGenesis@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update weather forecast"
          git push
