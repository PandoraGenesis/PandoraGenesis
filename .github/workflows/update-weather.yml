name: Update weather forecast

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate weather block
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.parse
          from datetime import datetime

          q = urllib.parse.urlencode({
              "key": os.environ["WEATHER_API_KEY"],
              "q": "Quy Nhon",
              "days": 5,
              "aqi": "no",
              "alerts": "no",
          })
          url = "https://api.weatherapi.com/v1/forecast.json?" + q
          with urllib.request.urlopen(url, timeout=30) as r:
              data = json.load(r)

          days = data["forecast"]["forecastday"]
          wd = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"]

          def cell(tag, content):
              return f"<{tag}>{content}</{tag}>"

          heads, icons, conds, temps, rains = [], [], [], [], []
          for fd in days:
              d = datetime.strptime(fd["date"], "%Y-%m-%d")
              day = fd["day"]
              heads.append(cell("th", f"{wd[d.weekday()]} {d:%d/%m}"))
              icon = "https:" + day["condition"]["icon"]
              icons.append(cell("td", f'<img src="{icon}" width="48" alt="">'))
              conds.append(cell("td", day["condition"]["text"]))
              temps.append(cell("td", f'{round(day["mintemp_c"])}° - {round(day["maxtemp_c"])}°C'))
              rains.append(cell("td", f'{day["daily_chance_of_rain"]}% mưa'))

          rows = [heads, icons, conds, temps, rains]
          html = "<table>\n" + "\n".join("<tr>" + "".join(r) + "</tr>" for r in rows) + "\n</table>"
          open("weather.md", "w", encoding="utf-8").write(html)
          EOF

      - name: Insert block into README
        run: |
          python3 - <<'EOF'
          import re
          readme = open("README.md", encoding="utf-8").read()
          block = open("weather.md", encoding="utf-8").read().strip()

          block = re.sub(r"<th(?![a-z])", '<th align="center"', block)
          block = re.sub(r"<td(?![a-z])", '<td align="center"', block)

          pattern = r"(<!-- WEATHER:START -->).*?(<!-- WEATHER:END -->)"
          new = re.sub(pattern, lambda m: m.group(1) + "\n" + block + "\n" + m.group(2), readme, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(new)
          EOF

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update weather forecast"
          git push
